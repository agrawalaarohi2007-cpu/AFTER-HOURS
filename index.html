<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoneyMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">

    <!-- Hero -->
    <div class="bg-gradient-to-br from-blue-700 to-indigo-600 text-white p-12 text-center">
      <div class="mx-auto w-20 h-20 bg-white/20 rounded-3xl flex items-center justify-center text-5xl mb-6">💰</div>
      <h1 class="text-4xl font-bold">MoneyMap</h1>
      <p class="text-lg mt-2 opacity-90">Financial Survival & Strategy Engine</p>
    </div>

    <div class="p-8">
      <h2 class="text-2xl font-semibold text-center mb-8">Let's Get Started</h2>

      <div class="space-y-6">
        <div>
          <label class="block text-sm text-gray-600 mb-2">Your Family Name</label>
          <input id="familyName" type="text" placeholder="Agarwal Parivar" 
                 class="w-full p-5 border border-gray-300 rounded-2xl text-lg">
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-2">Mobile Number</label>
          <input id="phone" type="tel" placeholder="98765 43210" 
                 class="w-full p-5 border border-gray-300 rounded-2xl text-lg">
        </div>

        <button onclick="startApp()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl text-lg font-semibold">
          Continue to Dashboard
        </button>
      </div>
    </div>
  </div>

  <script>
    function startApp() {
      const familyName = document.getElementById('familyName').value.trim() || "Your Family";
      const phone = document.getElementById('phone').value.trim();

      if (phone.length < 10) {
        alert("Please enter a valid mobile number");
        return;
      }

      localStorage.setItem('familyName', familyName);
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
