<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoneyMap - Shortfall Predictor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style> body { font-family: system-ui, sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

  <!-- Top Bar -->
  <div class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl">💰</div>
        <div>
          <h1 class="text-2xl font-bold" data-translate="appName">MoneyMap</h1>
          <p class="text-xs text-gray-500" data-translate="tagline">Financial Survival & Strategy Engine</p>
        </div>
      </div>
      <button onclick="speakCurrentPage()" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm flex items-center gap-2">
        <i class="fas fa-volume-up"></i> <span data-translate="speak">Speak</span>
      </button>
    </div>
  </div>

  <div class="max-w-2xl mx-auto p-4">

    <h1 class="text-2xl font-bold mb-6" data-translate="insights">Shortfall Predictor</h1>
    <p class="text-gray-600 mb-6">See where your spending is heading this month</p>

    <div class="bg-white rounded-3xl shadow p-6 mb-8">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1" data-translate="monthlyIncome">Monthly Income (₹)</label>
          <input id="income" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1" data-translate="currentDay">Current Day of Month</label>
          <input id="currentDay" type="number" value="15" class="w-full p-4 border rounded-2xl text-lg">
        </div>
      </div>

      <h3 class="font-semibold mt-8 mb-4">Major Expenses</h3>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Rent / EMI</label>
          <input id="rent" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Groceries</label>
          <input id="groceries" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Transport</label>
          <input id="transport" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Dining Out</label>
          <input id="dining" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Entertainment</label>
          <input id="entertainment" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Utilities</label>
          <input id="utilities" type="number" class="w-full p-4 border rounded-2xl text-lg">
        </div>
      </div>

      <button onclick="predictShortfall()" 
              class="mt-8 w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-lg font-semibold" 
              data-translate="predictShortfall">
        Predict Shortfall
      </button>
    </div>

    <!-- Result -->
    <div id="result" class="hidden bg-white rounded-3xl shadow p-6">
      <h2 class="font-semibold text-xl mb-4" data-translate="predictionResult">Prediction Result</h2>
      <div id="prediction-content"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t max-w-2xl mx-auto">
    <div class="flex justify-around py-3 text-xs">
      <a href="dashboard.html" class="flex flex-col items-center text-gray-500"><i class="fas fa-home text-2xl"></i><span data-translate="home">Home</span></a>
      <a href="transactions.html" class="flex flex-col items-center text-gray-500"><i class="fas fa-list text-2xl"></i><span data-translate="transactions">Transactions</span></a>
      <a href="investment.html" class="flex flex-col items-center text-gray-500"><i class="fas fa-chart-pie text-2xl"></i><span data-translate="invest">Invest</span></a>
      <a href="insights.html" class="flex flex-col items-center text-blue-600"><i class="fas fa-lightbulb text-2xl"></i><span data-translate="insights">Insights</span></a>
      <a href="settings.html" class="flex flex-col items-center text-gray-500"><i class="fas fa-cog text-2xl"></i><span data-translate="settings">Settings</span></a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function predictShortfall() {
      const income = parseFloat(document.getElementById('income').value) || 0;
      const currentDay = parseFloat(document.getElementById('currentDay').value) || 1;

      const rent = parseFloat(document.getElementById('rent').value) || 0;
      const groceries = parseFloat(document.getElementById('groceries').value) || 0;
      const transport = parseFloat(document.getElementById('transport').value) || 0;
      const dining = parseFloat(document.getElementById('dining').value) || 0;
      const entertainment = parseFloat(document.getElementById('entertainment').value) || 0;
      const utilities = parseFloat(document.getElementById('utilities').value) || 0;

      const totalExpense = rent + groceries + transport + dining + entertainment + utilities;
      const dailyExpense = currentDay > 0 ? totalExpense / currentDay : 0;
      const remainingDays = 30 - currentDay;
      const projectedExpense = dailyExpense * 30;
      const projectedBalance = income - projectedExpense;

      let resultHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 p-5 rounded-2xl text-center">
              <p class="text-gray-500">Projected Balance</p>
              <p class="text-3xl font-bold ${projectedBalance >= 0 ? 'text-green-600' : 'text-red-600'}">
                ₹${projectedBalance.toLocaleString('en-IN')}
              </p>
            </div>
            <div class="bg-gray-50 p-5 rounded-2xl text-center">
              <p class="text-gray-500">Days Remaining</p>
              <p class="text-3xl font-bold">${remainingDays}</p>
            </div>
          </div>

          <div class="bg-green-50 p-5 rounded-2xl">
            <p class="font-medium">Safe Daily Budget</p>
            <p class="text-3xl font-bold text-green-600">₹${remainingDays > 0 ? Math.round((income - projectedExpense) / remainingDays) : 0}</p>
          </div>

          ${projectedBalance < 0 ? `
            <div class="bg-red-50 p-5 rounded-2xl">
              <p class="font-medium text-red-700">Shortfall Alert!</p>
              <p class="text-red-600">You may run short by ₹${Math.abs(projectedBalance).toLocaleString('en-IN')} this month.</p>
              <p class="text-sm mt-2">Suggestions: Reduce dining out and entertainment expenses.</p>
            </div>` : `
            <div class="bg-green-50 p-5 rounded-2xl">
              <p class="font-medium text-green-700">You're on track!</p>
              <p class="text-green-600">Good job. Consider saving more into emergency fund.</p>
            </div>`}
        </div>
      `;

      document.getElementById('result').classList.remove('hidden');
      document.getElementById('prediction-content').innerHTML = resultHTML;
    }

    window.onload = () => {
      translatePage();
    };
  </script>
</body>
</html>
