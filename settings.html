<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoneyMap - Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

  <!-- Top Bar -->
  <div class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl">💰</div>
        <div>
          <h1 class="text-2xl font-bold" data-translate="appName">MoneyMap</h1>
          <p class="text-xs text-gray-500" data-translate="tagline">Financial Survival & Strategy Engine</p>
        </div>
      </div>
      <button onclick="speakCurrentPage()" 
              class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm flex items-center gap-2 hover:bg-blue-700 transition">
        <i class="fas fa-volume-up"></i> 
        <span data-translate="speak">Speak</span>
      </button>
    </div>
  </div>

  <div class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- Family Information -->
    <div class="bg-white rounded-3xl shadow p-6">
      <h2 class="font-semibold text-lg mb-4" data-translate="familyName">Family Information</h2>
      <div class="space-y-4">
        <div>
          <p class="text-sm text-gray-500">Family Name</p>
          <p id="display-family-name" class="font-medium text-xl">Aarohi</p>
        </div>
        <div>
          <p class="text-sm text-gray-500 mb-2" data-translate="members">Members</p>
          <div id="family-members" class="flex gap-3 flex-wrap"></div>
        </div>
      </div>
      <button onclick="addFamilyMember()" 
              class="mt-6 w-full border-2 border-blue-600 text-blue-600 py-3.5 rounded-2xl font-medium flex items-center justify-center gap-2" 
              data-translate="addMember">
        + Add Family Member
      </button>
    </div>

    <!-- Language & Translation -->
    <div class="bg-white rounded-3xl shadow p-6">
      <h2 class="font-semibold text-lg mb-4" data-translate="language">Language & Translation</h2>
      
      <div class="grid grid-cols-2 gap-4 mb-6">
        <button onclick="changeLanguage('en')" 
                class="py-4 rounded-2xl border-2 border-blue-600 font-medium hover:bg-blue-50">
          English
        </button>
        <button onclick="changeLanguage('hi')" 
                class="py-4 rounded-2xl border-2 border-gray-300 font-medium hover:bg-gray-50">
          हिंदी
        </button>
      </div>

      <div class="bg-gray-50 p-4 rounded-2xl">
        <p class="text-sm text-gray-600 mb-2">Google Translate Widget</p>
        <div id="google_translate_element"></div>
      </div>
    </div>

    <!-- Data Management -->
    <div class="bg-white rounded-3xl shadow p-6">
      <h2 class="font-semibold text-lg mb-4">Data Management</h2>
      <button onclick="clearData()" 
              class="w-full bg-red-100 text-red-700 py-4 rounded-2xl font-medium mb-3 hover:bg-red-200">
        Clear All Data
      </button>
      <button onclick="exportData()" 
              class="w-full border border-gray-300 py-4 rounded-2xl font-medium hover:bg-gray-50">
        Export All Data
      </button>
    </div>

    <!-- About -->
    <div class="bg-white rounded-3xl shadow p-6 text-center">
      <h2 class="font-bold text-2xl mb-1" data-translate="appName">MoneyMap</h2>
      <p class="text-gray-600" data-translate="tagline">Financial Survival & Strategy Engine</p>
      <p class="text-xs text-gray-500 mt-8">Hackathon Project 2026</p>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t max-w-2xl mx-auto">
    <div class="flex justify-around py-3 text-xs">
      <a href="dashboard.html" class="flex flex-col items-center text-gray-500">
        <i class="fas fa-home text-2xl"></i><span data-translate="home">Home</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center text-gray-500">
        <i class="fas fa-list text-2xl"></i><span data-translate="transactions">Transactions</span>
      </a>
      <a href="investment.html" class="flex flex-col items-center text-gray-500">
        <i class="fas fa-chart-pie text-2xl"></i><span data-translate="invest">Invest</span>
      </a>
      <a href="insights.html" class="flex flex-col items-center text-gray-500">
        <i class="fas fa-lightbulb text-2xl"></i><span data-translate="insights">Insights</span>
      </a>
      <a href="settings.html" class="flex flex-col items-center text-blue-600">
        <i class="fas fa-cog text-2xl"></i><span data-translate="settings">Settings</span>
      </a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi'
      }, 'google_translate_element');
    }

    let familyMembers = ["Papa", "Mummy", "You (Admin)"];

    function renderFamilyMembers() {
      const container = document.getElementById('family-members');
      container.innerHTML = familyMembers.map(member => `
        <div class="px-4 py-2 rounded-2xl text-sm ${member.includes('Admin') ? 'bg-blue-100 text-blue-700' : 'bg-gray-100'}">
          ${member}
        </div>
      `).join('');
    }

    function addFamilyMember() {
      const name = prompt(currentLang === 'hi' ? "नया सदस्य का नाम दर्ज करें:" : "Enter new family member name:");
      if (name && name.trim()) {
        familyMembers.push(name.trim());
        renderFamilyMembers();
      }
    }

    function clearData() {
      if (confirm("Clear all data?")) {
        localStorage.clear();
        alert("All data cleared!");
        location.reload();
      }
    }

    function exportData() {
      alert(currentLang === 'hi' ? "डेटा निर्यात हो गया!" : "Data exported!");
    }

    window.onload = () => {
      const familyName = localStorage.getItem('familyName') || "Aarohi";
      document.getElementById('display-family-name').textContent = familyName;
      renderFamilyMembers();
      translatePage();
    };
  </script>
</body>
</html>
